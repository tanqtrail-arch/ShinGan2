<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>真贋 - 絵画鑑定ゲーム</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Title Screen -->
    <div id="screen-title" class="screen title-screen">
      <div class="title-logo">
        <div class="title-kanji">真贋</div>
      </div>
      <p class="title-subtitle">絵画鑑定ゲーム</p>
      <p class="title-tagline">
        9つの美術様式、81の絵画。あなたの鑑定眼が試される。
      </p>
      <div class="title-actions">
        <button class="btn btn-primary" id="btn-start">鑑定を始める</button>
        <button class="btn btn-secondary" id="btn-dashboard">
          成績を見る
        </button>
      </div>
    </div>

    <!-- Stage Select Screen -->
    <div id="screen-stages" class="screen">
      <div class="container">
        <div class="stages-header">
          <h2>ステージ選択</h2>
          <p class="text-secondary">美術様式を選んで鑑定に挑戦</p>
        </div>
        <div id="stage-grid" class="stage-grid"></div>
        <div class="text-center">
          <button class="btn btn-back" id="btn-back-title">
            タイトルに戻る
          </button>
        </div>
      </div>
    </div>

    <!-- Stage Intro Screen -->
    <div id="screen-intro" class="screen intro-screen">
      <div class="container" style="display:flex;flex-direction:column;align-items:center;">
        <div class="intro-icon" id="intro-stage-icon"></div>
        <h2 class="intro-name" id="intro-stage-name"></h2>
        <p class="intro-period" id="intro-stage-period"></p>
        <div class="intro-description" id="intro-stage-description"></div>
        <div class="intro-actions">
          <button class="btn btn-primary" id="btn-start-stage">
            挑戦する
          </button>
          <button class="btn btn-back" id="btn-back-stages-intro">
            戻る
          </button>
        </div>
      </div>
    </div>

    <!-- Question Screen -->
    <div id="screen-question" class="screen">
      <div class="container">
        <!-- Header: progress -->
        <div class="question-header">
          <span class="question-stage-name" id="question-stage-name"></span>
          <span class="question-progress" id="question-progress"></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
        </div>

        <!-- Large Timer (visible only in judging phase) -->
        <div class="timer-area" id="timer-area">
          <div class="timer-circle-wrap">
            <svg class="timer-svg" viewBox="0 0 120 120">
              <circle class="timer-circle-bg" cx="60" cy="60" r="54" />
              <circle class="timer-circle-progress" id="timer-circle-progress" cx="60" cy="60" r="54" />
            </svg>
            <span class="timer-text" id="timer-text">15</span>
          </div>
          <div class="timer-bar-track">
            <div class="timer-fill" id="timer-bar" style="width: 100%"></div>
          </div>
        </div>

        <!-- Painting Info -->
        <div class="painting-info-card">
          <h3 class="painting-title" id="painting-title"></h3>
          <dl class="painting-meta">
            <dt>作者</dt>
            <dd id="painting-artist"></dd>
            <dt>制作年</dt>
            <dd id="painting-year"></dd>
            <dt>技法</dt>
            <dd id="painting-medium"></dd>
            <dt>サイズ</dt>
            <dd id="painting-size"></dd>
            <dt>所蔵</dt>
            <dd id="painting-location"></dd>
          </dl>
          <p class="painting-description" id="painting-description"></p>
        </div>

        <!-- Two Paintings Side by Side -->
        <div class="dual-painting-area" id="dual-painting-area">
          <div class="dual-painting-slot" id="slot-left">
            <div class="dual-painting-label">A</div>
            <div class="painting-canvas painting-frame" id="painting-canvas-left"></div>
          </div>
          <div class="dual-painting-slot" id="slot-right">
            <div class="dual-painting-label">B</div>
            <div class="painting-canvas painting-frame" id="painting-canvas-right"></div>
          </div>
        </div>

        <!-- Phase 1: Viewing (no timer, just read info) -->
        <div class="viewing-phase active" id="viewing-phase">
          <div class="viewing-message">
            <p class="viewing-label">2つの作品を見比べてください</p>
            <p class="viewing-sub">どちらが本物か、準備ができたら鑑定に進みましょう</p>
          </div>
          <button class="btn btn-primary btn-start-judge" id="btn-start-judge">
            鑑定に進む
            <span class="key-hint-inline">Enter</span>
          </button>
        </div>

        <!-- Phase 2: Judging (timer running, pick which is real) -->
        <div class="judging-phase" id="judging-phase">
          <div class="hint-area">
            <button class="hint-btn" id="hint-btn">ヒントを見る (H)</button>
            <div class="hint-text" id="hint-text"></div>
          </div>

          <p class="judge-prompt">どちらが本物？</p>
          <div class="judge-buttons">
            <button class="judge-btn pick-left" id="btn-pick-left">
              A
              <span class="key-hint">キー: 1 / ←</span>
            </button>
            <button class="judge-btn pick-right" id="btn-pick-right">
              B
              <span class="key-hint">キー: 2 / →</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Answer Overlay -->
      <div class="answer-overlay" id="answer-overlay">
        <div class="answer-content">
          <div id="answer-result"></div>
          <p class="answer-explanation" id="answer-explanation"></p>
          <button class="btn btn-primary" id="answer-next">次の問題へ</button>
        </div>
      </div>
    </div>

    <!-- Stage Result Screen -->
    <div id="screen-stage-result" class="screen result-screen">
      <div class="container">
        <p class="result-stage-name" id="result-stage-name"></p>
        <div class="result-score-display">
          <div class="result-score" id="result-score"></div>
        </div>
        <div class="result-stars" id="result-stars"></div>
        <div class="result-rank">
          <div class="result-rank-name" id="result-rank-name"></div>
          <div class="result-rank-desc" id="result-rank-desc"></div>
        </div>
        <div class="result-answers" id="result-answers"></div>
        <div class="result-actions">
          <button class="btn btn-primary" id="btn-result-next">
            次のステージへ
          </button>
          <button class="btn btn-secondary" id="btn-result-stages">
            ステージ選択に戻る
          </button>
        </div>
      </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="screen-dashboard" class="screen">
      <div class="container">
        <div class="dashboard-header">
          <h2>総合成績</h2>
        </div>
        <div class="dashboard-summary">
          <div class="dashboard-stat">
            <div class="dashboard-stat-label">総合スコア</div>
            <div class="dashboard-stat-value" id="dashboard-total">-</div>
          </div>
          <div class="dashboard-stat">
            <div class="dashboard-stat-label">総合ランク</div>
            <div class="dashboard-stat-value" id="dashboard-rank">-</div>
          </div>
        </div>
        <table class="dashboard-table">
          <thead>
            <tr>
              <th>Stage</th>
              <th>様式</th>
              <th>スコア</th>
              <th>ランク</th>
              <th>評価</th>
            </tr>
          </thead>
          <tbody id="dashboard-body"></tbody>
        </table>
        <div class="text-center">
          <button class="btn btn-back" id="btn-back-title-dash">
            タイトルに戻る
          </button>
        </div>
      </div>
    </div>

    <!-- Zoom Modal -->
    <div class="zoom-modal" id="zoom-modal">
      <div class="zoom-content" id="zoom-content"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
